<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17142b">
<title>ASA at Break!</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color:#202238;background:#f7f8fc;
  --purple:#6d5dfc;--purple2:#8a7dff;--pink:#ff7eb3;--yellow:#ffc857;
  --ink:#202238;--muted:#74778d;--card:#fff;--line:#e8e9f2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fbfbff 0%,#f3f5ff 100%)}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 18px 36px;position:relative}
.app:before,.app:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
.app:before{width:180px;height:180px;background:#e9e5ff;top:-70px;right:-55px}
.app:after{width:150px;height:150px;background:#ffe5f0;bottom:20px;left:-70px}
.app>*{position:relative;z-index:1}
.hero{text-align:center;padding:20px 0 12px}
.logo{width:82px;height:82px;margin:auto;border-radius:27px;display:grid;place-items:center;font-size:43px;background:linear-gradient(145deg,#fff,#eeeaff);box-shadow:0 16px 35px #6d5dfc22, inset 0 1px #fff;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #6d5dfc18}50%{box-shadow:0 0 0 10px #6d5dfc00}}
.screen-in{animation:pop .28s ease-out}
h1{font-size:34px;line-height:1.08;margin:15px 0 7px;letter-spacing:-1px}
h2{letter-spacing:-.5px}
.sub{color:var(--muted);font-size:15px}
.card{background:rgba(255,255,255,.9);border:1px solid rgba(30,32,60,.07);border-radius:24px;padding:18px;margin:13px 0;box-shadow:0 12px 30px #26264a0b}
.game{width:100%;text-align:left;color:var(--ink);background:#fff;padding:17px;border-radius:20px;margin:8px 0;display:flex;align-items:center;gap:14px;border:1px solid var(--line);transition:.18s;box-shadow:0 7px 18px #2d2b5708}
.game:hover{transform:translateY(-2px);box-shadow:0 12px 24px #2d2b5712}
.game .gicon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:#f2f0ff}
.game b{font-size:18px;display:block}.game span{display:block;color:var(--muted);margin-top:3px;font-size:13px}.game .arrow{margin-left:auto;color:#a0a2b2;font-size:22px}
label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:16px 0 7px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#fafaff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:#a69eff;box-shadow:0 0 0 4px #6d5dfc12}
option{color:#202238}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}
.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:15px 18px;border-radius:16px;font-weight:800;width:100%;margin-top:13px;box-shadow:0 10px 22px #6d5dfc2e}
.secondary{background:#fff;color:var(--ink);padding:13px 17px;border-radius:15px;width:100%;margin-top:10px;border:1px solid var(--line)}
.choice{background:#fff;color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:14px;font-weight:700}.choice.active{background:#f0eeff;border-color:#8d83ff;color:#5b4ff0}
.center{text-align:center}
.secret{font-size:43px;font-weight:900;margin:24px 0;word-break:break-word;letter-spacing:-1.5px}
.hint{background:#fff8df;border:1px solid #f8dc76;padding:14px;border-radius:16px;margin:15px 0;color:#6f5710}
.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#eeecff;color:#5c50df;font-size:12px;font-weight:800;letter-spacing:.3px}
.player{font-size:28px;font-weight:850;letter-spacing:-.5px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:12px;color:var(--ink)}
.big{font-size:56px;font-weight:900;letter-spacing:-2px;color:var(--ink);margin:15px 0}
.timer-card{padding:26px;border-radius:26px;background:linear-gradient(145deg,#fff,#f2f0ff);border:1px solid #e5e2ff;box-shadow:0 15px 35px #6d5dfc12}
.vote{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);padding:15px;border-radius:15px;margin:8px 0;border:1px solid var(--line);text-align:left}
.vote.selected{outline:2px solid var(--purple);background:#f3f1ff}
.danger{color:#b14c67}.disabled{opacity:.45;pointer-events:none}
.progress{height:7px;background:#eeeef5;border-radius:99px;overflow:hidden;margin:16px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:99px;transition:width .25s}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.toggle input{width:auto;accent-color:var(--purple)}
.footer-note{text-align:center;color:#9a9cab;font-size:12px;margin:18px 0}

.hint-setting{background:linear-gradient(135deg,#fffaf0,#fff);border:1px solid #f0e3bf;border-radius:18px;padding:15px;margin-top:15px}
.hint-setting-top{display:flex;align-items:center;gap:14px}
.hint-setting-top>div{flex:1}
.hint-setting-top input{width:21px;height:21px;flex:0;accent-color:var(--purple)}
.topic-note{font-size:12px;color:var(--muted);margin-top:7px}.hint-setting-copy{font-size:12px;line-height:1.45;color:var(--muted);margin-top:4px;font-weight:500}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const pairs = {"Food":[["Pancakes","Waffles","Often ordered in the morning"],["Popcorn","Nachos","Commonly associated with a relaxed evening"],["Samosa","Pakora","Often found at casual gatherings"],["Biryani","Pulao","Usually prepared as a hearty meal"],["Dosa","Crepe","Usually cooked on a hot flat surface"],["Idli","Dhokla","Often served in small pieces"],["Noodles","Spaghetti","Usually served in a bowl or on a plate"],["Taco","Wrap","Usually eaten without cutlery"],["Brownie","Fudge","Usually dense and intensely sweet"],["Muffin","Cupcake","Usually served as an individual portion"],["Gelato","Sorbet","Usually served chilled"],["Custard","Pudding","A soft dessert"],["Jam","Marmalade","Usually spread on bread"],["Cappuccino","Latte","Usually has a noticeable layer of milk"],["Espresso","Americano","Usually served in a cup"],["Lassi","Buttermilk","Usually served cold"],["Kebab","Tikka","Usually cooked over high heat"],["Paneer","Tofu","Often used as a meat alternative"],["Croissant","Danish","Usually flaky or layered"],["Pretzel","Bagel","A baked bread item"]],"Movies":[["Batman","Iron Man","A famous fictional hero"],["Sherlock Holmes","Hercule Poirot","A famous fictional detective"],["Avatar","Interstellar","A science-fiction film"],["Titanic","The Notebook","A romantic film"],["Thriller","Mystery","A movie genre"],["Comedy","Satire","A humorous movie style"],["Director","Producer","A filmmaking role"],["Actor","Performer","A person who plays a character"],["Trailer","Teaser","A promotional video"],["Sequel","Remake","A later version of a film"],["Villain","Antihero","A morally complex character"],["Hero","Protagonist","A central character"],["Plot","Storyline","The events of a film"],["Climax","Finale","A late part of a story"],["Cameo","Guest Role","A brief appearance"],["Dubbed","Subtitled","A translated viewing format"],["Cinema","Theatre","A place to watch films"],["Oscar","BAFTA","A film award"],["Horror","Suspense","A tension-focused genre"],["Documentary","Biopic","A non-fiction film style"]],"Places":[["Airport","Railway Station","A place used for travel"],["Beach","Lakeside","A place near water"],["Library","Bookstore","A place connected with books"],["Museum","Gallery","A place where things are displayed"],["Temple","Shrine","A place of worship"],["Cafe","Bistro","A casual place to eat"],["Mountain","Hill","An elevated landform"],["Valley","Canyon","A landform between high areas"],["Island","Peninsula","Land surrounded partly by water"],["Hotel","Resort","A place for travellers to stay"],["Stadium","Arena","A place for large events"],["Office","Coworking Space","A place to work"],["Market","Bazaar","A place where goods are sold"],["Park","Garden","A green public space"],["Bridge","Flyover","A structure carrying traffic"],["Metro","Tram","Urban public transport"],["Hospital","Clinic","A healthcare facility"],["University","College","An educational institution"],["Museum","Exhibition Hall","A place for displays"],["Harbor","Marina","A place for boats"]],"Office":[["Meeting","Discussion","A work conversation"],["Presentation","Demo","A way of showing work"],["Manager","Team Lead","A person guiding a team"],["Deadline","Milestone","A project planning point"],["Bug","Defect","A software problem"],["Feature","Enhancement","A software capability"],["Developer","Engineer","A software role"],["Tester","QA Engineer","A quality role"],["Laptop","Notebook","A portable computer"],["Desktop","Workstation","A computer used for work"],["Slack","Teams","A workplace chat tool"],["GitHub","GitLab","A code collaboration platform"],["Ticket","Task","A piece of tracked work"],["Sprint","Iteration","A development cycle"],["Standup","Sync","A short team meeting"],["Coffee","Tea","A common office drink"],["Keyboard","Mouse","A computer peripheral"],["Branch","Fork","A code repository concept"],["Commit","Push","A Git action"],["Release","Deployment","Putting software into use"]],"Sports":[["Cricket","Baseball","A bat-and-ball sport"],["Tennis","Badminton","A racket sport"],["Football","Rugby","A field team sport"],["Basketball","Netball","A ball sport with a hoop"],["Boxing","MMA","A combat sport"],["Hockey","Lacrosse","A stick-and-ball sport"],["Marathon","Triathlon","An endurance event"],["Goalkeeper","Defender","A defensive player"],["Striker","Forward","An attacking player"],["Referee","Umpire","An official"],["Stadium","Arena","A sports venue"],["Coach","Manager","A person leading a team"],["Bat","Racket","Sports equipment"],["Serve","Volley","A racket-sport action"],["Penalty","Foul","A rule violation"],["League","Tournament","A sports competition format"],["Medal","Trophy","A competition prize"],["Sprint","Relay","A running event"],["Wicket","Stump","A cricket object"],["Pitch","Field","An area where a sport is played"]],"Games":[["Chess","Checkers","A classic board game"],["Ludo","Carrom","A familiar tabletop game"],["Minecraft","Terraria","A sandbox game"],["Roblox","Fortnite","A popular online game"],["Controller","Gamepad","A gaming input device"],["Keyboard","Controller","A gaming input device"],["Puzzle","Riddle","A problem-solving activity"],["Monopoly","Risk","A strategy board game"],["Uno","Cards","A card game"],["Poker","Rummy","A card game"],["Mario","Sonic","A famous game character"],["Pac-Man","Tetris","A classic game"],["Level","Stage","A section of a game"],["Boss","Enemy","A game opponent"],["Quest","Mission","A game objective"],["Avatar","Character","A player representation"],["Console","PC","A gaming platform"],["Arcade","Carnival","A place associated with games"],["Dice","Spinner","A random game component"],["Team","Squad","A group of players"]],"Animals":[["Dog","Wolf","A four-legged animal"],["Lion","Tiger","A large wild cat"],["Dolphin","Shark","An ocean animal"],["Eagle","Hawk","A bird of prey"],["Cheetah","Leopard","A spotted big cat"],["Horse","Donkey","A domesticated equine"],["Rabbit","Hare","A small mammal"],["Crocodile","Alligator","A large reptile"],["Frog","Toad","An amphibian"],["Bee","Wasp","A flying stinging insect"],["Butterfly","Moth","A winged insect"],["Penguin","Puffin","A seabird"],["Owl","Eagle","A bird associated with flight"],["Camel","Llama","A hoofed animal"],["Goat","Sheep","A farm animal"],["Seal","Sea Lion","A marine mammal"],["Octopus","Squid","A tentacled sea animal"],["Whale","Dolphin","A marine mammal"],["Snake","Lizard","A reptile"],["Panda","Koala","A tree-associated mammal"]],"Vehicles":[["Scooter","Motorcycle","A two-wheeled vehicle"],["Train","Metro","Public transport"],["Tram","Trolleybus","Urban public transport"],["Helicopter","Drone","An aircraft that can hover"],["Car","SUV","A road vehicle"],["Sedan","Hatchback","A passenger car type"],["Van","Minibus","A people-carrying vehicle"],["Taxi","Cab","A hired car"],["Ferry","Cruise Ship","A passenger vessel"],["Yacht","Sailboat","A recreational boat"],["Bicycle","E-bike","A two-wheeled vehicle"],["Truck","Lorry","A goods vehicle"],["Jeep","SUV","An off-road vehicle"],["Bus","Coach","A passenger road vehicle"],["Subway","Metro","An underground train"],["Rocket","Missile","A fast propelled vehicle"],["Glider","Sailplane","An aircraft without normal engine propulsion"],["Tractor","Harvester","An agricultural vehicle"],["Ambulance","Fire Engine","An emergency vehicle"],["Bulldozer","Excavator","Heavy construction machinery"]],"Technology":[["iPhone","Android Phone","A modern mobile device"],["GitHub","GitLab","A developer platform"],["Wi-Fi","Bluetooth","A wireless technology"],["API","Database","A software development concept"],["Cloud","Server","A computing concept"],["Browser","Search Engine","A way to find information online"],["Compiler","Interpreter","A programming language tool"],["Java","JavaScript","A programming language"],["Python","Ruby","A programming language"],["Docker","Virtual Machine","A software isolation technology"],["Kubernetes","Docker Swarm","A container orchestration technology"],["RAM","Cache","Fast computer memory"],["SSD","USB Drive","Digital storage"],["Monitor","Projector","A display device"],["Keyboard","Keypad","An input device"],["Password","PIN","A security credential"],["Email","Chat","Digital communication"],["HTTP","HTTPS","A web protocol"],["Frontend","Backend","A software architecture layer"],["Repository","Project","A software development container"]]};

let state={screen:"home",players:6,names:[],topic:"Random",difficulty:"hard",hint:true,pair:null,imposter:0,current:0,revealed:false,used:[],votes:[],selected:null,truthData:[],truthCurrent:0,truthGuess:null,whoDeck:[],whoCurrent:0,whoGuesser:null,whoStart:0};

const $=id=>document.getElementById(id);
function render(){ $("app").innerHTML = views[state.screen](); }

function home(){
return `<div class="screen-in">
<div class="hero"><div class="logo">🎮</div><h1>ASA at Break!</h1><div class="sub">Pass the phone. Let the chaos begin. 😄</div></div>
<div class="card">
${`<button class="game" onclick="setup()"><span class="gicon">🕵️</span><span><b>Imposter</b><span>Find the player who doesn't belong</span></span><span class="arrow">›</span></button>
<button class="game" onclick="truthSetup()"><span class="gicon">🤥</span><span><b>2 Truths & 1 Lie</b><span>Spot the lie</span></span><span class="arrow">›</span></button>
<button class="game" onclick="whoSetup()"><span class="gicon">🤔</span><span><b>Who Am I?</b><span>Guess your secret identity</span></span><span class="arrow">›</span></button>`}
</div>
<div class="card"><span class="pill">ONE PHONE • OFFLINE</span><p class="muted">No accounts. No room codes. Just pass the phone around and play.</p></div>
<div class="footer-note">Built for quick breaks ☕</div>
</div>`;
}
function setup(){
state.screen="setup"; state.names=Array.from({length:state.players},(_,i)=>state.names[i]||"");
render();
}
function setupView(){
let names=state.names.map((n,i)=>`<label>Player ${i+1}<input value="${esc(n)}" oninput="state.names[${i}]=this.value" placeholder="Name"></label>`).join("");
return `<div class="screen-in"><button class="secondary" onclick="goHome()">← Back</button><h1>🕵️ Imposter</h1><div class="sub">Pairs are carefully chosen to be close enough to make the clues tricky. They will never repeat on this phone until the full bank is exhausted.</div>
<div class="card"><label>Players: <b>${state.players}</b></label><input type="range" min="3" max="15" value="${state.players}" oninput="state.players=+this.value; state.names=Array.from({length:state.players},(_,i)=>state.names[i]||''); render()">
<label>Topic</label>
<select onchange="state.topic=this.value">
${["Random",...Object.keys(pairs)].map(x=>`<option ${x==state.topic?"selected":""}>${x}</option>`).join("")}
</select>
<div class="topic-note">Choose a topic or leave it on Random for a surprise pair.</div>
<div class="hint-setting">
  <div class="hint-setting-top">
    <div>
      <b>🧠 Imposter Hint</b>
      <div class="hint-setting-copy">Optional. The hint is deliberately vague — it helps the Imposter bluff without giving away the word.</div>
    </div>
    <input type="checkbox" ${state.hint?"checked":""} onchange="state.hint=this.checked">
  </div>
</div>
</div>
<div class="card"><b>Player names</b>${names}</div>
<button class="primary" onclick="startImposter()">Start Game</button><button class="secondary" onclick="resetPairs()">Reset Used Words on This Phone</button></div>`;
}
function resetPairs(){
  localStorage.removeItem("officePartyUsedPairs_v2");
  alert("All used word pairs have been reset on this phone.");
}
function startImposter(){
let pool=Object.entries(pairs).flatMap(([topic,arr])=>arr.map(x=>({...x,topic})));
if(state.topic!=="Random") pool=pool.filter(x=>x.topic===state.topic);

// Every pair is treated as HARD. A pair is permanently remembered on this device
// until the complete available pool has been exhausted.
const storageKey = "officePartyUsedPairs_v2";
let used = JSON.parse(localStorage.getItem(storageKey) || "[]");
const keyFor = x => `${x.topic}::${x[0]}::${x[1]}`;
let available = pool.filter(x => !used.includes(keyFor(x)));

if(!available.length){
    // Only after ALL available pairs are exhausted do we start a fresh cycle.
    used = [];
    available = pool.slice();
}
state.pair=available[Math.floor(Math.random()*available.length)];
used.push(keyFor(state.pair));
localStorage.setItem(storageKey, JSON.stringify(used));

state.imposter=Math.floor(Math.random()*state.players);
state.current=0;
state.revealed=false;
state.screen="pass";render();
}
function passView(){
let name=state.names[state.current]||`Player ${state.current+1}`;
if(!state.revealed)return `<div class="center screen-in"><div class="pill">PASS THE PHONE</div><h1 class="player">${esc(name)}</h1><p class="muted">Tap only when this player is ready. Keep the secret hidden from everyone else.</p><button class="primary" onclick="state.revealed=true;render()">Reveal Secret</button></div>`;
let imp=state.current===state.imposter;
return `<div class="center"><div class="pill">${state.current+1} / ${state.players}</div>
<div class="emoji">${imp?"🕵️":"🔐"}</div><h2>${imp?"YOU ARE THE IMPOSTER":"YOUR WORD"}</h2>
<div class="secret">${imp?"IMPOSTER":esc(state.pair[0])}</div>
${imp&&state.hint?`<div class="hint">
  <b>💡 Your vague clue</b>
  <div style="margin-top:5px">${esc(state.pair[2])}</div>
  <small style="display:block;margin-top:7px;opacity:.7">Use it to blend in — it should not reveal the answer.</small>
</div>`:""}
${imp&&!state.hint?`<p class="danger">No hint. Good luck 😈</p>`:""}
<button class="primary" onclick="nextSecret()">${state.current+1<state.players?"Hide & Pass":"Finish Secret Setup"}</button></div>`;
}
function nextSecret(){if(state.current+1<state.players){state.current++;state.revealed=false;render()}else{state.screen="play";render()}}
function playView(){return `<div class="center screen-in"><div class="emoji">🕵️</div><h1>Discuss!</h1><div class="big" id="timer">03:00</div><p class="muted">Give clues without making your word too obvious. Find the Imposter.</p><button class="primary" onclick="startTimer()">Start 3-Minute Timer</button><button class="secondary" onclick="vote()">Vote Now</button></div>`}
let timerInterval=null;
function startTimer(){if(timerInterval)return;let t=180; timerInterval=setInterval(()=>{t--;let el=$("timer");if(el)el.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;if(t<=0){clearInterval(timerInterval);timerInterval=null;vote()}},1000)}
function vote(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}state.votes=[];state.selected=null;state.screen="vote";render()}
function voteView(){return `<div class="screen-in"><button class="secondary" onclick="state.screen='play';render()">← Back</button><h1>🗳️ Vote</h1><p class="muted">Discuss, then select who you think is the Imposter.</p>${state.names.map((n,i)=>`<button class="vote ${state.selected===i?"selected":""}" onclick="state.selected=${i};render()"><span>${esc(n||`Player ${i+1}`)}</span><span>${state.selected===i?"✓":"○"}</span></button>`).join("")}<button class="primary" ${state.selected===null?"disabled":""} onclick="state.screen='result';render()">Reveal</button></div>`}
function resultView(){let correct=state.selected===state.imposter;return `<div class="center screen-in"><div class="emoji">${correct?"🎉":"😈"}</div><h1>${correct?"Caught!":"Fooled You!"}</h1><div class="secret">${esc(state.names[state.imposter]||`Player ${state.imposter+1}`)}</div><p>${correct?"The team found the Imposter.":"The Imposter survived the vote."}</p><button class="primary" onclick="startImposter()">Play Another Round</button><button class="secondary" onclick="goHome()">Back to Games</button></div>`}
function coming(icon,title){state.screen="coming";state.coming=[icon,title];render()}
function comingView(){return `<div class="center screen-in"><button class="secondary" onclick="goHome()">← Back</button><div class="emoji">${state.coming[0]}</div><h1>${state.coming[1]}</h1><p class="muted">Coming next. The Imposter game is the first playable MVP.</p></div>`}
function goHome(){state.screen="home";render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

/* ---------------- 2 TRUTHS & 1 LIE ---------------- */

function truthSetup(){
  state.screen="truthSetup";
  state.names=Array.from({length:state.players},(_,i)=>state.names[i]||"");
  render();
}
function truthSetupView(){
  let names=state.names.map((n,i)=>`<label>Player ${i+1}<input value="${esc(n)}" oninput="state.names[${i}]=this.value" placeholder="Name"></label>`).join("");
  return `<div class="screen-in">
    <button class="back" onclick="goHome()">← Back</button>
    <h1>🤥 2 Truths & 1 Lie</h1>
    <div class="sub">Each player secretly writes 3 statements. The group tries to catch the lie.</div>
    <div class="card">
      <label>Players: <b>${state.players}</b></label>
      <input type="range" min="3" max="15" value="${state.players}" oninput="state.players=+this.value;state.names=Array.from({length:state.players},(_,i)=>state.names[i]||'');render()">
    </div>
    <div class="card"><b>Player names</b>${names}</div>
    <button class="primary" onclick="startTruths()">Start Game</button>
  </div>`;
}
function startTruths(){
  state.truthData=[];
  state.truthCurrent=0;
  state.truthGuess=null;
  state.screen="truthEnter";
  render();
}
function truthEnterView(){
  let name=state.names[state.truthCurrent]||`Player ${state.truthCurrent+1}`;
  return `<div class="center screen-in">
    <div class="pill">PRIVATE • ${state.truthCurrent+1} / ${state.players}</div>
    <h1>${esc(name)}</h1>
    <p class="muted">Only this player should hold the phone. Enter 3 statements about yourself.</p>
    <div class="card">
      <label>Statement 1</label><input id="t1" placeholder="Something true or false">
      <label>Statement 2</label><input id="t2" placeholder="Something true or false">
      <label>Statement 3</label><input id="t3" placeholder="Something true or false">
      <label>Which one is the lie?</label>
      <div class="row">
        <button class="choice active" id="lie1" onclick="chooseLie(1)">#1</button>
        <button class="choice" id="lie2" onclick="chooseLie(2)">#2</button>
        <button class="choice" id="lie3" onclick="chooseLie(3)">#3</button>
      </div>
    </div>
    <button class="primary" onclick="saveTruthPlayer()">Hide & Pass</button>
  </div>`;
}
let currentLie=1;
function chooseLie(n){
  currentLie=n;
  [1,2,3].forEach(i=>{let e=$("lie"+i);if(e)e.className="choice "+(i===n?"active":"")});
}
function saveTruthPlayer(){
  let a=$("t1").value.trim(),b=$("t2").value.trim(),c=$("t3").value.trim();
  if(!a||!b||!c){alert("Please fill all 3 statements.");return}
  state.truthData.push({name:state.names[state.truthCurrent]||`Player ${state.truthCurrent+1}`,statements:[a,b,c],lie:currentLie});
  currentLie=1;
  if(state.truthCurrent+1<state.players){state.truthCurrent++;state.screen="truthEnter";render()}
  else {state.truthCurrent=0;state.truthGuess=null;state.screen="truthPlay";render()}
}
function truthPlayView(){
  let d=state.truthData[state.truthCurrent];
  return `<div class="screen-in">
    <div class="topbar"><button class="back" onclick="goHome()">← Exit</button><span class="pill">${state.truthCurrent+1} / ${state.players}</span></div>
    <div class="center"><h1>🤥 Who's lying?</h1><div class="sub">Read the statements aloud and debate with the group.</div></div>
    <div class="card">
      <h2>${esc(d.name)}</h2>
      ${d.statements.map((s,i)=>`<button class="vote ${state.truthGuess===i+1?"selected":""}" onclick="state.truthGuess=${i+1};render()"><span><b>${i+1}.</b> ${esc(s)}</span><span>${state.truthGuess===i+1?"✓":"○"}</span></button>`).join("")}
    </div>
    <button class="primary ${state.truthGuess===null?"disabled":""}" onclick="showTruthResult()">Reveal Lie</button>
  </div>`;
}
function showTruthResult(){state.screen="truthReveal";render()}
function truthRevealView(){
  let d=state.truthData[state.truthCurrent], correct=state.truthGuess===d.lie;
  return `<div class="center screen-in">
    <div class="emoji">${correct?"🎉":"😈"}</div>
    <h1>${correct?"Caught the lie!":"Fooled the group!"}</h1>
    <div class="card"><b>The lie was #${d.lie}</b><p>${esc(d.statements[d.lie-1])}</p></div>
    <button class="primary" onclick="nextTruthPlayer()">Next Player</button>
  </div>`;
}
function nextTruthPlayer(){
  if(state.truthCurrent+1<state.players){state.truthCurrent++;state.truthGuess=null;state.screen="truthPlay";render()}
  else {state.screen="home";render()}
}

/* ---------------- WHO AM I? ---------------- */

const whoPeople=[
"Albert Einstein","A. P. J. Abdul Kalam","Sachin Tendulkar","Virat Kohli","M. S. Dhoni",
"Rajinikanth","Shah Rukh Khan","Amitabh Bachchan","Ratan Tata","Elon Musk",
"Steve Jobs","Taylor Swift","Cristiano Ronaldo","Lionel Messi","Michael Jackson",
"Mr. Bean","Harry Potter","Sherlock Holmes","Batman","Spider-Man","Iron Man",
"Superman","Doraemon","Tom & Jerry","Mickey Mouse","Pikachu","Mario","Jack Sparrow",
"Wednesday Addams","James Bond","Cinderella","Simba","Mowgli","Hulk","Thor"
];

function whoSetup(){state.screen="whoSetup";render()}
function whoSetupView(){
  return `<div class="screen-in">
    <button class="back" onclick="goHome()">← Back</button>
    <h1>🤔 Who Am I?</h1>
    <div class="sub">Pass the phone. Your identity is secret. Everyone else gives clues.</div>
    <div class="card">
      <label>Players: <b>${state.players}</b></label>
      <input type="range" min="3" max="15" value="${state.players}" oninput="state.players=+this.value;render()">
      <p class="muted">Each player gets a different person or character.</p>
    </div>
    <button class="primary" onclick="startWho()">Start Game</button>
  </div>`;
}
function startWho(){
  let shuffled=[...whoPeople].sort(()=>Math.random()-.5);
  state.whoDeck=shuffled.slice(0,state.players);
  state.whoCurrent=0;
  state.whoGuesser=null;
  state.screen="whoPass";render();
}
function whoPassView(){
  let name=state.names[state.whoCurrent]||`Player ${state.whoCurrent+1}`;
  return `<div class="center screen-in">
    <div class="pill">PASS THE PHONE • ${state.whoCurrent+1} / ${state.players}</div>
    <h1>${esc(name)}</h1>
    <p class="muted">Hold the phone so everyone except you can see the identity.</p>
    <button class="primary" onclick="state.screen='whoPlay';state.whoStart=Date.now();render()">Show My Identity</button>
  </div>`;
}
function whoPlayView(){
  let identity=state.whoDeck[state.whoCurrent];
  return `<div class="center screen-in">
    <div class="pill">DON'T LOOK AT THE SCREEN</div>
    <h1>🤫 Everyone else, give clues!</h1>
    <div class="card" style="padding:30px">
      <div class="secret">${esc(identity)}</div>
      <p class="muted">The player holding the phone should not see this.</p>
    </div>
    <button class="primary" onclick="state.screen='whoResult';render()">They Guessed It!</button>
    <button class="secondary" onclick="nextWho()">Skip / Couldn't Guess</button>
  </div>`;
}
function nextWho(){
  if(state.whoCurrent+1<state.players){state.whoCurrent++;state.screen="whoPass";render()}
  else {state.screen="home";render()}
}
function whoResultView(){
  return `<div class="center screen-in">
    <div class="emoji">🎉</div><h1>Correct!</h1>
    <div class="secret">${esc(state.whoDeck[state.whoCurrent])}</div>
    <button class="primary" onclick="nextWho()">Next Player</button>
  </div>`;
}

const views={home,setup:setupView,pass:passView,play:playView,vote:voteView,result:resultView,coming:comingView,truthSetup:truthSetupView,truthEnter:truthEnterView,truthPlay:truthPlayView,truthReveal:truthRevealView,whoSetup:whoSetupView,whoPass:whoPassView,whoPlay:whoPlayView,whoResult:whoResultView};
render();
</script>
